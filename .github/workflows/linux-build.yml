name: Linux release build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Test installer
        run: sh tests/install-linux.sh
      - name: Prepare Linux binary
        run: cp target/release/mssh mssh-linux-x86_64
      - name: Add Linux build to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" mssh-linux-x86_64 --repo "$GITHUB_REPOSITORY" --clobber
