# Copy to ~/.config/mssh/config.toml on Linux.
# host_key is optional. Without it, SSH host keys are not verified.
# To pin a node, obtain its fingerprint over a trusted channel and add:
# host_key = "SHA256:..."

direct_hosts = ["edge_a", "edge_b"]
paths = [
  ["edge_a", "internal"],
  ["edge_b", "internal"],
]

[settings]
connect_timeout_secs = 10
check_interval_secs = 30
chunk_size = 1048576

[nodes.edge_a]
host = "edge-a.example.org"
user = "alice"
key_file = "~/.ssh/id_ed25519"

[nodes.edge_b]
host = "edge-b.example.org"
user = "alice"
agent = true

[nodes.internal]
host = "10.0.0.15"
user = "alice"
password = "REPLACE_WITH_PASSWORD"
